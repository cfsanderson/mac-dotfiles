# borrowed heavily from @omerxx - https://github.com/omerxx/dotfiles/tree/master/tmux

source-file ~/.config/tmux/tmux.reset.conf

setw -g pane-base-index 1        # start indexing panes at 1 instead of 0
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc"
setw -g mode-keys vi

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# catppuccin/tmux (manually cloned, not TPM-managed - see
# bootstrap/catppuccin-tmux.md - upstream flags a TPM name-conflict issue),
# recolored to the cfs-gruvbox-material palette used everywhere else (see
# colors/colors/gruvbox-material-palette.toml). @thm_* must be set *before*
# the plugin's `run` below: its theme file only sets them with -o
# (only-if-unset).
set -g @thm_bg "#282828"
set -g @thm_fg "#e5dac7"
set -g @thm_rosewater "#d3869b"
set -g @thm_flamingo "#e78a4e"
set -g @thm_pink "#d3869b"
set -g @thm_mauve "#d3869b"
set -g @thm_red "#ea6962"
set -g @thm_maroon "#e78a4e"
set -g @thm_peach "#e78a4e"
set -g @thm_yellow "#d8a657"
set -g @thm_green "#a9b665"
set -g @thm_teal "#89b482"
set -g @thm_sky "#89b482"
set -g @thm_sapphire "#7daea3"
set -g @thm_blue "#7daea3"
set -g @thm_lavender "#d3869b"
set -g @thm_subtext_1 "#e5dac7"
set -g @thm_subtext_0 "#ddc7a1"
set -g @thm_overlay_2 "#a89984"
set -g @thm_overlay_1 "#928374"
set -g @thm_overlay_0 "#7c6f64"
set -g @thm_surface_2 "#504945"
set -g @thm_surface_1 "#3c3836"
set -g @thm_surface_0 "#32302f"
set -g @thm_mantle "#282828"
set -g @thm_crust "#1a1919"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# add plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# run tpm
run '~/.tmux/plugins/tpm/tpm'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# status line modules - catppuccin's built-ins, no extra tmux plugins needed
# (must be set after the `run` above)
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# pane styles (set after plugins to override theme)
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g window-style 'fg=#928374,bg=default'
set -g window-active-style 'fg=#DCC6A3,bg=default'

# Pane navigation (override vim-tmux-navigator to ensure these work with Kitty)
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R
